<!-- ============================================================
     PROTECCION DE RUTA
     Si no hay sesion, redirige a login.html
     ============================================================ -->
<script>
(function () {
  try {
    var haySesion = !!localStorage.getItem('pym_json_sesion');
    if (!haySesion) {
      location.replace('login.html');
    }
  } catch (e) {
    location.replace('login.html');
  }
})();
</script>

<!-- ============================================================
     BOTON SALIR (logout)
     ============================================================ -->
<script>
document.getElementById('pym-btn-salir').addEventListener('click', function () {
  if (confirm('Cerrar sesion?')) {
    if (typeof AUTH !== 'undefined' && AUTH.cerrarSesion) {
      AUTH.cerrarSesion();
    } else {
      localStorage.removeItem('pym_json_sesion');
    }
    location.replace('login.html');
  }
});
</script>

<!-- ============================================================
     SERVICE WORKER
     ============================================================ -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js')
      .then(function (reg) {
        console.log('[SW] Registrado. Scope:', reg.scope);

        reg.addEventListener('updatefound', function () {
          var nuevo = reg.installing;
          if (!nuevo) return;
          nuevo.addEventListener('statechange', function () {
            if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[SW] Nueva version instalada. Activando...');
              nuevo.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(function (err) {
        console.warn('[SW] Error al registrar:', err);
      });
  });

  var recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (recargando) return;
    recargando = true;
    console.log('[SW] Controlador cambio -> recargando la app');
    location.reload();
  });
}
</script>
