<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PYM Util - Lector y Conversor</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PYM Util">

<!-- Favicon SVG inline (sin 404) -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-plataforma="pc">

  <!-- HEADER -->
  <header class="pym-header">
    <div class="pym-header-fila">
      <h1 class="pym-titulo">PYM Util</h1>
      <div class="pym-reloj">
        <div id="pym-fecha">--/--/----</div>
        <div id="pym-hora">--:--:--</div>
      </div>
    </div>
    <div class="pym-header-fila">
      <small id="pym-info-archivo" class="pym-visitas">
        JSON: (ninguno) &nbsp;|&nbsp; Tipo: -
      </small>
      <button id="pym-btn-salir" class="pym-btn-logout" title="Cerrar sesion">
        Salir
      </button>
    </div>
  </header>

  <!-- MENU -->
  <main class="pym-main">
    <div id="pym-menu" class="pym-menu"></div>
  </main>

  <!-- FOOTER -->
  <footer class="pym-footer">
    <span id="pym-estado">Sistema listo.</span>
  </footer>

  <!-- CONTENEDORES DINAMICOS -->
  <div id="pym-modales"></div>
  <div id="pym-toasts"></div>
  
 <!-- ANTES de los SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  
  <!-- SCRIPTS -->
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/plataforma.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/ventana.js"></script>

 <script src="js/acciones/cargar-json.js"></script>
<script src="js/acciones/split.js"></script>
<script src="js/acciones/json-a-csv.js"></script>
<script src="js/acciones/explorar.js"></script>   <!-- NUEVO -->

  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>

  <!-- BOTON SALIR -->
  <script>
    document.getElementById('pym-btn-salir').addEventListener('click', function () {
      if (confirm('Cerrar sesion?')) {
        AUTH.cerrarSesion();
        location.replace('login.html');
      }
    });
  </script>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) {
            console.log('[SW] Registrado. Scope:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[SW] Error al registrar:', err);
          });
      });
    }
  </script>

</body>
</html>
